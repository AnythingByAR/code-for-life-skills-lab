
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Website</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #090919, #24104f);
        }

        .container {
            padding: 40px;
            border: 1px solid #8b5cf6;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px #7c3aed;
        }

        h1 {
            color: #c084fc;
            text-shadow: 0 0 15px #a855f7;
        }

        p {
            color: #d1d5db;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            border: none;
            border-radius: 30px;
            background: #a855f7;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #7c3aed;
            box-shadow: 0 0 20px #c084fc;
            transform: scale(1.08);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to the Future 🚀</h1>
        <p>This is my awesome neon website.</p>
        <p id="message">Click the button below!</p>

        <button onclick="changeMessage()">
            Click Me
        </button>
    </div>

    <script>
        function changeMessage() {
            document.getElementById("message").innerText =
                "✨ You just activated the future! ✨";
        }
    </script>

</body>
</html>
